name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: build-vet-test (${{ matrix.os }})
    env:
      ASSAYER_REPO: ${{ github.workspace }}/assayer
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # v16-release S8: Ubuntu 24.04's AppArmor profile restricts
      # unprivileged user-namespace creation by default (the April-2024
      # kernel security update); GitHub's ubuntu-latest image now resolves
      # to a 24.04 base, so any code path that unshares a user namespace
      # (Assayer's sandboxed checks call unshare(2)) fails with "write
      # failed /proc/self/uid_map: Operation not permitted" -- a runner
      # environment restriction, not an application defect. Real containers
      # (Docker) opt into this properly; a bare CI runner has no equivalent,
      # so this is the documented relaxation used by Chromium/Docker's own
      # GitHub Actions runners for the identical symptom.
      - name: Allow unprivileged user namespaces (Ubuntu 24.04 AppArmor restriction)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # v16-release S8: actions/setup-python prepends its hostedtoolcache
      # Python to PATH ahead of /usr/bin on every platform. That install is
      # group-writable (toolregistry.inspectPath rightly refuses to trust
      # it) AND, on Linux, any wrapper built to dodge that check breaks
      # Landlock instead: internal/enforce/landlock.go's exactReadClosure
      # only computes a read closure for real ELF executables (see
      # internal/contextgraph/graph_test.go's buildCodegraphELF comment) --
      # a #!/bin/sh wrapper script is denied at exec time with "enforce:
      # exec sandboxed executable: permission denied". The actual fix is to
      # never resolve "python3" to the hostedtoolcache copy at all: prefer
      # the real system /usr/bin/python3 (root-owned, a genuine ELF, never
      # group-writable) for every subsequent step in this job, matching
      # what "Enroll trusted tools" below already does explicitly.
      - name: Prefer system python3 (Landlock/toolregistry compatibility)
        if: runner.os == 'Linux'
        run: echo "/usr/bin" >> "$GITHUB_PATH"

      - name: Read pinned Assayer ref from assayer.lock
        id: test-assayer-ref
        shell: bash
        run: |
          ref="$(python3 -c "
          import sys
          for line in open(sys.argv[1]):
              line = line.split('#', 1)[0].strip()
              if line.startswith('ref='):
                  print(line[4:]); break
          " assayer.lock)"
          if [ -z "$ref" ]; then
            echo "::error::assayer.lock does not declare a ref= entry"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out Assayer at its pinned ref
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.ASSAYER_REPOSITORY || 'cousingary/assayer' }}
          ref: ${{ steps.test-assayer-ref.outputs.ref }}
          path: assayer
          fetch-depth: 0

      - name: Install portable red-team dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo /usr/bin/python3 -m pip install --break-system-packages cryptography pytest
          else
            python3 -m pip install cryptography pytest
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y minisign=0.11-1
            command -v minisign && minisign -v 2>&1 || true
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install minisign util-linux
          fi
          # macOS has no Landlock, so the private-wrapper trick below (a
          # #!/bin/sh script standing in for python3, dodging the group-
          # writable hostedtoolcache install) is safe there. It is NOT safe
          # on Linux -- see the "Prefer system python3" step above for why;
          # Linux instead avoids the hostedtoolcache python entirely via
          # PATH ordering and never needs this wrapper.
          if [ "$RUNNER_OS" = "macOS" ]; then
            secure_bin="$RUNNER_TEMP/governator-tools"
            mkdir -p "$secure_bin"
            chmod 0700 "$secure_bin"
            real_python="$(command -v python3)"
            {
              echo '#!/bin/sh'
              printf 'exec "%s" "$@"\n' "$real_python"
            } > "$secure_bin/python3"
            cp "$(brew --prefix util-linux)/bin/setsid" "$secure_bin/setsid"
            cp "$(command -v minisign)" "$secure_bin/minisign"
            chmod 0755 "$secure_bin/python3" "$secure_bin/setsid" "$secure_bin/minisign"
          fi
          printf '/assayer/\n' >> .git/info/exclude
          if ! git show-ref --verify --quiet refs/heads/main; then
            git branch --track main origin/main
          fi

      - name: Enroll trusted tools
        shell: bash
        run: |
          mkdir -p "$HOME/.governator"
          git_bin="$(command -v git)"
          if [ -x /usr/bin/git ]; then git_bin=/usr/bin/git; fi
          go run ./cmd/gov tools enroll git "$git_bin" || echo "::warning::git enrollment failed"
          go run ./cmd/gov tools enroll bash "$(command -v bash)" || echo "::warning::bash enrollment failed"
          py_bin="$(command -v python3)"
          if [ -x /usr/bin/python3 ]; then py_bin=/usr/bin/python3; fi
          go run ./cmd/gov tools enroll python3 "$py_bin" || echo "::warning::python3 enrollment failed"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Sol redteam v3 S14 (finding #20 / P2.3): "no cached results and no
      # skips" — -count=1 on every test invocation below, run as its own step
      # distinct from the race tier so a race-only difference in behavior
      # can't hide inside a single combined step.
      - name: Test (unit, -count=1)
        run: go test -count=1 ./...

      - name: Test (race, -count=1)
        run: go test -race -count=1 ./...

      # The black-box security regression corpus: every Sol3-prefixed test
      # written across the audit's 15 findings (governator-sol3-repair-plan.md
      # standing rule 4 requires the "Sol3"/"sol3_" naming so this is always
      # findable). Already covered incidentally by the race step above, but a
      # named, always-visible CI step is the actual release-CI proof the
      # audit asks for — not an assertion that these test functions merely
      # exist.
      - name: Black-box security regression corpus (all 15 Sol3 findings)
        run: go test -run 'Sol3' -v -count=1 ./...

      # Sol redteam v6 S0 (P0-18): internal/redteam/'s 17 build-tagged files
      # (`//go:build redteam`) were never compiled by any CI or release
      # command — the "Sol3" step above never triggers the redteam tag, so
      # every permanent red-team attack was silently excluded from every CI
      # run. These two steps are the exact commands the v6 report requires.
      # Skips are not failures; the skip count is the project burn-down
      # (agents/governator-sol-upgrade6-plan.md). Full record fields land
      # in S8.
      - name: Red-team corpus (-tags redteam, -count=1)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            export GOV_SYSTEM_PYTHON3="$(command -v python3)"
            export PATH="$RUNNER_TEMP/governator-tools:$PATH"
          fi
          go test -tags redteam -count=1 ./...

      - name: Red-team corpus (-race, -tags redteam, -count=1)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            export GOV_SYSTEM_PYTHON3="$(command -v python3)"
            export PATH="$RUNNER_TEMP/governator-tools:$PATH"
          fi
          # v16-release S8: the non-race red-team run alone took ~9.5m for
          # internal/redteam; -race's instrumentation overhead pushed
          # internal/runtime's suite past Go's default 10m per-package test
          # timeout on this runner (the goroutine dump at the panic showed a
          # live, bounded 20ms poll inside containment.resolveNSInitPID --
          # not an actual hang, just mid-cycle when the clock ran out).
          # Widen the budget rather than touching the containment code.
          go test -race -tags redteam -count=1 -timeout=30m ./...

      - name: gofmt check
        shell: bash
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

  assay-integration:
    name: assay integration (real Assayer CLI, mandatory)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # v16-release S8: see the identical step in the test job -- Ubuntu
      # 24.04's default AppArmor restriction on unprivileged user namespaces
      # breaks Assayer's unshare(2)-based sandboxed checks on ubuntu-latest.
      - name: Allow unprivileged user namespaces (Ubuntu 24.04 AppArmor restriction)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Read pinned Assayer ref from assayer.lock
        id: assayer-ref
        run: |
          ref=$(python3 -c "
          import sys
          for line in open(sys.argv[1]):
              line = line.split('#', 1)[0].strip()
              if line.startswith('ref='):
                  print(line[4:]); break
          " assayer.lock)
          if [ -z "$ref" ]; then
            echo "::error::assayer.lock does not declare a ref= entry"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out Assayer at its pinned ref
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.ASSAYER_REPOSITORY || 'cousingary/assayer' }}
          ref: ${{ steps.assayer-ref.outputs.ref }}
          path: assayer
          fetch-depth: 0

      - name: Enroll trusted python3
        run: |
          mkdir -p "$HOME/.governator"
          py="$(command -v python3)"
          if [ -x /usr/bin/python3 ]; then py=/usr/bin/python3; fi
          go run ./cmd/gov tools enroll python3 "$py"

      - name: Real Assayer CLI integration test
        env:
          ASSAYER_REPO: ${{ github.workspace }}/assayer
        run: go test -tags=integration -run TestEvaluateAgainstRealCLIPassAndFail -v ./internal/assay/...

  claims:
    name: claims ledger (docs/claims.yaml)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Enroll trusted git
        run: |
          mkdir -p "$HOME/.governator"
          go run ./cmd/gov tools enroll git "$(command -v git)"

      - name: gov claims verify
        run: go run ./cmd/gov claims verify

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install golangci-lint (built with this Go toolchain)
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: golangci-lint
        run: golangci-lint run ./...

  fuzz:
    name: fuzz (30s per target)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Enroll trusted tools
        run: |
          mkdir -p "$HOME/.governator"
          go run ./cmd/gov tools enroll git /usr/bin/git || true
          go run ./cmd/gov tools enroll bash /usr/bin/bash || true
          go run ./cmd/gov tools enroll python3 /usr/bin/python3 || true

      - name: Fuzz FuzzClassifyShellCommand
        run: go test -fuzz=FuzzClassifyShellCommand -fuzztime=30s ./internal/policy

      - name: Fuzz FuzzContractParser
        run: go test -fuzz=FuzzContractParser -fuzztime=30s ./internal/contracts

      - name: Fuzz FuzzBashProtectedReason
        run: go test -fuzz=FuzzBashProtectedReason -fuzztime=30s ./internal/runtime

  cross-compile:
    name: cross-compile smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build darwin/arm64
        env:
          CGO_ENABLED: "0"
          GOOS: darwin
          GOARCH: arm64
        run: go build ./...

      - name: Build linux/arm64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: go build ./...

  # v16-release Session 6 (R4): native acceptance evidence per platform.
  # Standing rule 12's constraint lifts here -- not because the rule relaxed,
  # but because real macos-latest (arm64) and ubuntu-24.04-arm runners now
  # execute the acceptance smoke test the release flow runs. Every published
  # archive must carry executed native acceptance evidence, or not be
  # published. These jobs produce that evidence: they build the binary for the
  # runner's native architecture with the same ldflags identity the release
  # embeds, then run the four acceptance checks (archive_extracted,
  # executable_bit_preserved, binary_hash_matches_build,
  # version_json_matches_manifest) via scripts/acceptance_smoke.sh -- the
  # CI-runnable twin of release.sh's run_acceptance_check.
  #
  # The acceptance JSON is uploaded as a build artifact so it can be cited as
  # the executed-evidence source for ClassifyPlatformWithEvidence /
  # PublicationDecision (cases 401-402). A platform whose acceptance job is
  # green on its native architecture is eligible to be approving; one without a
  # green native run is not.
  native-acceptance:
    name: native acceptance (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Enroll trusted tools
        shell: bash
        run: |
          mkdir -p "$HOME/.governator"
          git_bin="$(command -v git)"
          if [ -x /usr/bin/git ]; then git_bin=/usr/bin/git; fi
          go run ./cmd/gov tools enroll git "$git_bin"
          py_bin="$(command -v python3)"
          if [ -x /usr/bin/python3 ]; then py_bin=/usr/bin/python3; fi
          go run ./cmd/gov tools enroll python3 "$py_bin"
          # v16-release S8: this job never enrolled bash, so any unit test
          # that resolves a trusted bash handle (LocalWorktreeRunner.Prepare,
          # the chaos hung-validator test's shell()) failed immediately with
          # "no enrolled path" rather than exercising the behavior under
          # test -- unrelated to the platform this job exists to evidence.
          go run ./cmd/gov tools enroll bash "$(command -v bash)"

      - name: Compute release identity
        shell: bash
        run: |
          COMMIT="$(git rev-parse HEAD)"
          SHORT_COMMIT="$(git rev-parse --short=12 HEAD)"
          EXACT_TAG="$(git describe --tags --exact-match HEAD 2>/dev/null || true)"
          if [ -n "$EXACT_TAG" ]; then VERSION="${EXACT_TAG#v}"; else VERSION="ci-native-${SHORT_COMMIT}"; fi
          CLAIMS_HASH="$(sha256sum docs/claims.yaml | awk '{print $1}')"
          BUILD_TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.sourceCommit=${COMMIT} -X main.buildTimestamp=${BUILD_TS} -X main.claimsHash=${CLAIMS_HASH} -X main.adapterProtocolVersion=adapter-protocol-v1"
          {
            echo "VERSION=${VERSION}"
            echo "COMMIT=${COMMIT}"
            echo "CLAIMS_HASH=${CLAIMS_HASH}"
            echo "LDFLAGS=${LDFLAGS}"
          } >> "$GITHUB_ENV"

      - name: Build and run native acceptance smoke test
        shell: bash
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags "$LDFLAGS" -o gov ./cmd/gov
          ./scripts/acceptance_smoke.sh ./gov "$VERSION" "$COMMIT" "$CLAIMS_HASH" acceptance.json


      - name: Unit tests (native arch)
        run: go test -count=1 ./...

      - name: Race tests (native arch)
        run: go test -race -count=1 ./...

      - name: Upload native acceptance evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-acceptance-${{ matrix.runner }}
          path: acceptance.json
