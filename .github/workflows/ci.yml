name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: build-vet-test (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Enroll trusted tools
        shell: bash
        run: |
          mkdir -p "$HOME/.governator"
          go run ./cmd/gov tools enroll git "$(command -v git)"
          go run ./cmd/gov tools enroll bash "$(command -v bash)"
          go run ./cmd/gov tools enroll python3 "$(command -v python3)"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Sol redteam v3 S14 (finding #20 / P2.3): "no cached results and no
      # skips" — -count=1 on every test invocation below, run as its own step
      # distinct from the race tier so a race-only difference in behavior
      # can't hide inside a single combined step.
      - name: Test (unit, -count=1)
        run: go test -count=1 ./...

      - name: Test (race, -count=1)
        run: go test -race -count=1 ./...

      # The black-box security regression corpus: every Sol3-prefixed test
      # written across the audit's 15 findings (governator-sol3-repair-plan.md
      # standing rule 4 requires the "Sol3"/"sol3_" naming so this is always
      # findable). Already covered incidentally by the race step above, but a
      # named, always-visible CI step is the actual release-CI proof the
      # audit asks for — not an assertion that these test functions merely
      # exist.
      - name: Black-box security regression corpus (all 15 Sol3 findings)
        run: go test -run 'Sol3' -v -count=1 ./...

      # Sol redteam v6 S0 (P0-18): internal/redteam/'s 17 build-tagged files
      # (`//go:build redteam`) were never compiled by any CI or release
      # command — the "Sol3" step above never triggers the redteam tag, so
      # every permanent red-team attack was silently excluded from every CI
      # run. These two steps are the exact commands the v6 report requires.
      # Skips are not failures; the skip count is the project burn-down
      # (agents/governator-sol-upgrade6-plan.md). Full record fields land
      # in S8.
      - name: Red-team corpus (-tags redteam, -count=1)
        run: go test -tags redteam -count=1 ./...

      - name: Red-team corpus (-race, -tags redteam, -count=1)
        run: go test -race -tags redteam -count=1 ./...

      - name: gofmt check
        shell: bash
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

  assay-integration:
    name: assay integration (real Assayer CLI, mandatory)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Read pinned Assayer ref from assayer.lock
        id: assayer-ref
        run: |
          ref=$(python3 -c "
          import sys
          for line in open(sys.argv[1]):
              line = line.split('#', 1)[0].strip()
              if line.startswith('ref='):
                  print(line[4:]); break
          " assayer.lock)
          if [ -z "$ref" ]; then
            echo "::error::assayer.lock does not declare a ref= entry"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out Assayer at its pinned ref
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.ASSAYER_REPOSITORY || 'cousingary/assayer' }}
          ref: ${{ steps.assayer-ref.outputs.ref }}
          path: assayer

      - name: Real Assayer CLI integration test
        env:
          ASSAYER_REPO: ${{ github.workspace }}/assayer
        run: go test -tags=integration -run TestEvaluateAgainstRealCLIPassAndFail -v ./internal/assay/...

  claims:
    name: claims ledger (docs/claims.yaml)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Enroll trusted git
        run: |
          mkdir -p "$HOME/.governator"
          go run ./cmd/gov tools enroll git "$(command -v git)"

      - name: gov claims verify
        run: go run ./cmd/gov claims verify

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install golangci-lint (built with this Go toolchain)
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: golangci-lint
        run: golangci-lint run ./...

  fuzz:
    name: fuzz (30s per target)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Fuzz FuzzClassifyShellCommand
        run: go test -fuzz=FuzzClassifyShellCommand -fuzztime=30s ./internal/policy

      - name: Fuzz FuzzContractParser
        run: go test -fuzz=FuzzContractParser -fuzztime=30s ./internal/contracts

      - name: Fuzz FuzzBashProtectedReason
        run: go test -fuzz=FuzzBashProtectedReason -fuzztime=30s ./internal/runtime

  cross-compile:
    name: cross-compile smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build darwin/arm64
        env:
          CGO_ENABLED: "0"
          GOOS: darwin
          GOARCH: arm64
        run: go build ./...

      - name: Build linux/arm64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: go build ./...
