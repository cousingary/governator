name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: build-vet-test (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race ./...

      - name: gofmt check
        shell: bash
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

  assay-integration:
    name: assay integration (real Assayer CLI, mandatory)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # This is the blocking Assayer boundary (plan v1.4 Session 2): the real
      # `cli.py evaluate` subcommand run against the pinned fixture checked
      # into internal/assay/testdata/assayer_fixture/. Unlike the fast tier
      # above, there is no t.Skip path left in this test — a missing/broken
      # fixture or a missing python3 interpreter is a hard test failure
      # (t.Fatal), so this step fails the job rather than silently passing
      # green on a boundary that never actually executed.
      - name: Real Assayer CLI integration test
        run: go test -tags=integration -run TestEvaluateAgainstRealCLIPassAndFail -v ./internal/assay/...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  fuzz:
    name: fuzz (30s per target)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Fuzz FuzzClassifyShellCommand
        run: go test -fuzz=FuzzClassifyShellCommand -fuzztime=30s ./internal/policy

      - name: Fuzz FuzzContractParser
        run: go test -fuzz=FuzzContractParser -fuzztime=30s ./internal/contracts

      - name: Fuzz FuzzBashProtectedReason
        run: go test -fuzz=FuzzBashProtectedReason -fuzztime=30s ./internal/runtime

  cross-compile:
    name: cross-compile smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build darwin/arm64
        env:
          CGO_ENABLED: "0"
          GOOS: darwin
          GOARCH: arm64
        run: go build ./...

      - name: Build linux/arm64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: go build ./...
