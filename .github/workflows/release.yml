name: Release

# Sol redteam v3 S14 (finding #20 / P2.2, P2.3): the single, unified release
# pipeline. Triggered by a `v*` tag push; delegates entirely to
# scripts/release.sh (the canonical entry point — see that script's header
# for why .goreleaser.yml was retired) so a local run and a CI run produce
# byte-for-byte the same file set: gov_<version>_<platform>.tar.gz per
# platform, checksums.txt, build-manifest.json, sbom.json, claims.yaml,
# test-summary.json, acceptance-summary.json, checksums.txt.hmac (only when
# GOV_RELEASE_HMAC_KEY is configured; Sol9 P2-2 renamed this from the
# ambiguous "signature").
#
# This workflow is inert until a git remote and a `v*` tag exist (docs/
# publishing.md step 2/5) — it is committed now so the CI proof mechanism is
# declared and ready, per the audit's P2.3 correction, even though no live
# run has executed yet in this environment.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Derive VERSION from the pushed tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Materialize the minisign secret key (optional)
        # GOV_RELEASE_MINISIGN_KEY (scripts/release.sh's expected env var)
        # is a FILE PATH minisign reads with -s; a GitHub secret is a
        # string value, not a file on the runner. Only secrets.* may be
        # referenced directly in a workflow `run:` step (never echoed to a
        # log), so this writes the key content to a runner-local file with
        # secrets.GOV_RELEASE_MINISIGN_KEY_CONTENT read only inside the
        # step, exports its path if the secret is configured, and no-ops
        # (an empty MINISIGN_KEY_PATH) when it's absent -- release.sh's own
        # "no key configured" path then correctly skips asymmetric signing
        # rather than failing.
        if: ${{ secrets.GOV_RELEASE_MINISIGN_KEY_CONTENT != '' }}
        env:
          MINISIGN_KEY_CONTENT: ${{ secrets.GOV_RELEASE_MINISIGN_KEY_CONTENT }}
        run: |
          key_path="$RUNNER_TEMP/gov-release-minisign.key"
          printf '%s' "$MINISIGN_KEY_CONTENT" >"$key_path"
          chmod 600 "$key_path"
          echo "MINISIGN_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Run the unified release pipeline
        env:
          GOV_RELEASE_HMAC_KEY: ${{ secrets.GOV_RELEASE_HMAC_KEY }}
          GOV_RELEASE_MINISIGN_KEY: ${{ env.MINISIGN_KEY_PATH }}
          # P0-7 (Sol redteam v4 S8): this is the actual publish path (tag
          # push only) -- always require HEAD to carry the exact v<version>
          # tag this run claims, closing "build releases only from a clean,
          # tagged commit." Local dry-runs (docs/publishing.md) leave this
          # unset and keep working from a clean but untagged tree.
          REQUIRE_TAG: "1"
          REQUIRE_ASYMMETRIC_SIGNATURE: "1"
        run: scripts/release.sh

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gov-${{ env.VERSION }}
          path: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/checksums.txt.minisig
            dist/build-manifest.json
            dist/architecture-build-metadata.json
            dist/sbom.json
            dist/claims.yaml
            dist/test-summary.json
            dist/acceptance-summary.json
            dist/claims-verify-report.txt
            dist/checksums.txt.hmac
          if-no-files-found: warn

      - name: Create GitHub release (draft)
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/checksums.txt.minisig
            dist/build-manifest.json
            dist/architecture-build-metadata.json
            dist/sbom.json
            dist/claims.yaml
            dist/test-summary.json
            dist/acceptance-summary.json
            dist/claims-verify-report.txt
            dist/checksums.txt.hmac
