name: Release

# Sol redteam v3 S14 (finding #20 / P2.2, P2.3): the single, unified release
# pipeline. Triggered by a `v*` tag push; delegates entirely to
# scripts/release.sh (the canonical entry point — see that script's header
# for why .goreleaser.yml was retired) so a local run and a CI run produce
# byte-for-byte the same file set: gov_<version>_<platform>.tar.gz per
# platform, checksums.txt, build-manifest.json, sbom.json, claims.yaml,
# test-summary.json, acceptance-summary.json, checksums.txt.hmac (only when
# GOV_RELEASE_HMAC_KEY is configured; Sol9 P2-2 renamed this from the
# ambiguous "signature").
#
# Sol11 rc5 Session 8 (P1-4/P1-6/P1-8): this workflow now reproduces the
# FULL local release pipeline on a clean GitHub-hosted runner. Before this
# session it checked out only Governator and configured Go, omitting the
# Assayer checkout, the Python 3.10–3.13 matrix, Minisign, and ASSAYER_REPO
# — so the documented tag-push workflow could not actually produce the
# release it claimed (Sol11 P1-4). It now checks out Assayer at the ref
# pinned in assayer.lock, installs every required interpreter and minisign,
# and lets release.sh auto-detect strict release mode from HEAD's own tag
# (P1-8) while recording every tool's exact binary hash (P1-6).
#
# This workflow is inert until a git remote and a `v*` tag exist (docs/
# publishing.md step 2/5) — it is committed now so the CI proof mechanism is
# declared and ready, per the audit's P2.3 correction, even though no live
# run has executed yet in this environment.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  darwin-native-evidence:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Run native Darwin acceptance and red-team tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-evidence
          commit="$(git rev-parse HEAD)"
          version="${GITHUB_REF_NAME#v}"
          claims_hash="$(shasum -a 256 docs/claims.yaml | awk '{print $1}')"
          build_ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X main.version=${version} -X main.sourceCommit=${commit} -X main.buildTimestamp=${build_ts} -X main.claimsHash=${claims_hash} -X main.adapterProtocolVersion=adapter-protocol-v1"
          CGO_ENABLED=0 go build -trimpath -ldflags "$ldflags" -o native-evidence/gov ./cmd/gov
          ./scripts/acceptance_smoke.sh native-evidence/gov "$version" "$commit" "$claims_hash" native-evidence/acceptance.json
          test_re='^(TestV12Case34DarwinNativeContainmentNeverClaimsStrongScope|TestV12Case35DarwinNativeAssayerRefusesRatherThanDegrades)$'
          go test -v -count=1 -tags redteam -run "$test_re" ./internal/redteam | tee native-evidence/test-redteam-darwin.log
          go test -v -race -count=1 -tags redteam -run "$test_re" ./internal/redteam | tee native-evidence/test-redteam-race-darwin.log
          python3 - native-evidence "$commit" <<'PY'
          import hashlib, json, pathlib, sys
          root, commit = pathlib.Path(sys.argv[1]), sys.argv[2]
          logs = ("test-redteam-darwin.log", "test-redteam-race-darwin.log")
          data = {
              "schema_version": 1,
              "governator_commit": commit,
              "platform": "darwin_arm64",
              "logs": {name: hashlib.sha256((root / name).read_bytes()).hexdigest() for name in logs},
          }
          (root / "darwin-redteam-evidence.json").write_text(
              json.dumps(data, indent=2, sort_keys=True) + "\n")
          PY

      - name: Upload native Darwin evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: darwin-native-evidence
          path: native-evidence/**
          if-no-files-found: error

  # v16-release S8: scripts/release.sh's EVIDENCE_DIR promotion mechanism
  # (any *.json in EVIDENCE_DIR with a passing extracted_platform record
  # promotes that platform) is fully generic -- it was only ever fed
  # Darwin's evidence here, so linux_arm64 published non-approving in the
  # first real v1.0.2 cut despite ci.yml's native-acceptance
  # (ubuntu-24.04-arm) job already proving the capability exists. Unlike
  # Darwin, linux_arm64 has no dedicated native red-team corpus (S6b's
  # case 34/35 native-vs-cross-compiled distinction is Darwin-specific), so
  # this only needs the plain acceptance smoke evidence, not a red-team run.
  linux-arm64-native-evidence:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Run native linux/arm64 acceptance smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-evidence
          commit="$(git rev-parse HEAD)"
          version="${GITHUB_REF_NAME#v}"
          claims_hash="$(sha256sum docs/claims.yaml | awk '{print $1}')"
          build_ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X main.version=${version} -X main.sourceCommit=${commit} -X main.buildTimestamp=${build_ts} -X main.claimsHash=${claims_hash} -X main.adapterProtocolVersion=adapter-protocol-v1"
          CGO_ENABLED=0 go build -trimpath -ldflags "$ldflags" -o native-evidence/gov ./cmd/gov
          ./scripts/acceptance_smoke.sh native-evidence/gov "$version" "$commit" "$claims_hash" native-evidence/acceptance.json

      - name: Upload native linux/arm64 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-arm64-native-evidence
          path: native-evidence/**
          if-no-files-found: error

  release:
    needs: [darwin-native-evidence, linux-arm64-native-evidence]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # A tag-triggered checkout is detached and does not materialize a local
      # main branch, even when origin/main exists. The canonical topology gate
      # intentionally checks refs/heads/main, so fetch that exact branch
      # without moving HEAD or rewriting any existing ref.
      - name: Materialize the release branch for the topology gate
        run: git fetch --no-tags origin refs/heads/main:refs/heads/main

      # P1-4 (Sol11 rc5 Session 8): read the pinned Assayer ref from the
      # version-controlled assayer.lock so CI and local releases check out
      # the exact same Assayer commit. scripts/assayer_verify.sh (run inside
      # release.sh) independently confirms the checkout's HEAD carries a Git
      # tag matching Assayer's own pyproject.toml version.
      - name: Read pinned Assayer ref from assayer.lock
        id: assayer-ref
        run: |
          ref=$(python3 -c "
          import sys
          for line in open(sys.argv[1]):
              line = line.split('#', 1)[0].strip()
              if line.startswith('ref='):
                  print(line[4:]); break
          " assayer.lock)
          if [ -z "$ref" ]; then
            echo "::error::assayer.lock does not declare a ref= entry"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out Assayer at its pinned ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ vars.ASSAYER_REPOSITORY || 'cousingary/assayer' }}
          ref: ${{ steps.assayer-ref.outputs.ref }}
          path: assayer
          fetch-depth: 0

      # Assayer is a pinned release input, not Governator source. Keep this
      # runner-local checkout out of Governator's untracked-file cleanliness
      # check without weakening the repository-wide .gitignore.
      - name: Isolate the pinned Assayer checkout from source cleanliness
        run: |
          printf '/assayer/\n' >> .git/info/exclude
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error::Governator source checkout is dirty after isolating Assayer"
            git status --short
            exit 1
          fi

      # Ubuntu 24.04 runner images ship AppArmor's additional unprivileged
      # user-namespace restriction enabled. Governator's mandatory Linux
      # integration tests exercise the real Landlock+unshare containment
      # path, so fail closed unless this ephemeral runner can enable that
      # kernel capability.
      - name: Enable the mandatory Linux containment capability
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      # P1-4 (Sol11 rc5 Session 8): release.sh's Assayer matrix exercises
      # Python 3.10, 3.11, 3.12, and 3.13 explicitly (python3.10 .. python3.13).
      # A GitHub-hosted runner ships only the system Python; install each
      # minor explicitly so the matrix runs for real, not four invocations of
      # the same interpreter mislabeled as a matrix.
      - name: Install Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Install Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      # Sol13 P0-2/P1-4: this provisioning step does not make the ambient
      # package trusted. The reviewed policy check below must match its exact
      # path and digest before a release can proceed.
      - name: Install Minisign
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y minisign=0.11-1
          command -v minisign && minisign -v 2>&1 || true

      # P1-4: assert every interpreter the Assayer matrix requires is actually
      # on PATH -- a clean runner has none of them pre-installed, and a missing
      # python3.X is a release-blocking FAIL inside release.sh. Failing here
      # gives a clearer error than a mid-matrix discovery.
      - name: Verify the full Python matrix is on PATH
        run: |
          for py in python3.10 python3.11 python3.12 python3.13; do
            if ! command -v "$py" >/dev/null 2>&1; then
              echo "::error::${py} is not on PATH — the Assayer matrix cannot run"
              exit 1
            fi
            echo "$py: $("$py" -c 'import platform; print(platform.python_version())')"
          done

      - name: Verify CI release-tool policy and workflow identity
        env:
          GOV_RELEASE_RUNNER_LABEL: ubuntu-24.04
        run: |
          python3 scripts/builder_provenance.py \
            --workflow .github/workflows/release.yml \
            --check-workflow
          python3 scripts/release_toolset.py \
            --policy scripts/release_tool_policy_ci.yaml \
            --profile github-hosted-ephemeral \
            --out "$RUNNER_TEMP/toolset-preflight.json"

      - name: Derive VERSION from the pushed tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Download native Darwin evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: darwin-native-evidence
          path: ${{ runner.temp }}/darwin-native-evidence

      - name: Download native linux/arm64 evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-arm64-native-evidence
          path: ${{ runner.temp }}/linux-arm64-native-evidence

      - name: Merge native acceptance evidence
        # release.sh's EVIDENCE_DIR scanner globs *.json non-recursively in
        # one directory; each platform's artifact carries its own
        # acceptance.json (and Darwin's carries additional red-team-
        # specific files consumed separately via
        # GOV_DARWIN_REDTEAM_EVIDENCE_DIR, which still points at the raw
        # darwin-native-evidence dir below). Copy under unique names so
        # neither acceptance.json overwrites the other.
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-acceptance-evidence"
          cp "$RUNNER_TEMP/darwin-native-evidence/acceptance.json" "$RUNNER_TEMP/native-acceptance-evidence/darwin_arm64-acceptance.json"
          cp "$RUNNER_TEMP/linux-arm64-native-evidence/acceptance.json" "$RUNNER_TEMP/native-acceptance-evidence/linux_arm64-acceptance.json"

      - name: Materialize the minisign secret key (optional)
        # GOV_RELEASE_MINISIGN_KEY (scripts/release.sh's expected env var)
        # is a FILE PATH minisign reads with -s; a GitHub secret is a
        # string value, not a file on the runner. Only secrets.* may be
        # referenced directly in a workflow `run:` step (never echoed to a
        # log), so this writes the key content to a runner-local file with
        # secrets.GOV_RELEASE_MINISIGN_KEY_CONTENT read only inside the
        # step, exports its path if the secret is configured, and no-ops
        # (an empty MINISIGN_KEY_PATH) when it's absent -- release.sh's own
        # "no key configured" path then correctly skips asymmetric signing
        # rather than failing.
        env:
          MINISIGN_KEY_CONTENT: ${{ secrets.GOV_RELEASE_MINISIGN_KEY_CONTENT }}
        run: |
          if [ -z "$MINISIGN_KEY_CONTENT" ]; then
            echo "No minisign key configured; skipping asymmetric signing"
            exit 0
          fi
          key_path="$RUNNER_TEMP/gov-release-minisign.key"
          printf '%s' "$MINISIGN_KEY_CONTENT" >"$key_path"
          chmod 600 "$key_path"
          echo "MINISIGN_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Run the unified release pipeline
        env:
          GOV_RELEASE_HMAC_KEY: ${{ secrets.GOV_RELEASE_HMAC_KEY }}
          GOV_RELEASE_MINISIGN_KEY: ${{ env.MINISIGN_KEY_PATH }}
          # P1-4 (Sol11 rc5 Session 8): ASSAYER_REPO set explicitly to the
          # path the Assayer checkout step materialized above. Before this,
          # release.sh defaulted to /mnt/e/downloads/assayer, a path that
          # does not exist on a GitHub-hosted runner.
          ASSAYER_REPO: ${{ github.workspace }}/assayer
          # P1-8 (Sol11 rc5 Session 8): release.sh now auto-detects strict
          # release mode from HEAD's own v* tag, so REQUIRE_TAG would engage
          # without this env var. Kept explicit as belt-and-suspenders and
          # to document intent -- a tag push is always a real release.
          REQUIRE_TAG: "1"
          REQUIRE_ASYMMETRIC_SIGNATURE: "1"
          GOV_RELEASE_TOOL_POLICY: ${{ github.workspace }}/scripts/release_tool_policy_ci.yaml
          RELEASE_TOOL_PROFILE: github-hosted-ephemeral
          GOV_RELEASE_RUNNER_LABEL: ubuntu-24.04
          GOV_DARWIN_REDTEAM_EVIDENCE_DIR: ${{ runner.temp }}/darwin-native-evidence
          EVIDENCE_DIR: ${{ runner.temp }}/native-acceptance-evidence
          OUT_DIR: ${{ runner.temp }}/governator-release-dist
        run: scripts/release.sh

      - name: Upload release artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gov-${{ env.VERSION }}
          path: |
            ${{ runner.temp }}/governator-release-dist/**
          include-hidden-files: true
          if-no-files-found: warn

      - name: Attest the signed release manifest
        id: attest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ runner.temp }}/governator-release-dist/checksums.txt

      - name: Create GitHub release (draft)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          files: |
            ${{ runner.temp }}/governator-release-dist/*.tar.gz
            ${{ runner.temp }}/governator-release-dist/*.json
            ${{ runner.temp }}/governator-release-dist/*.yaml
            ${{ runner.temp }}/governator-release-dist/*.txt
            ${{ runner.temp }}/governator-release-dist/*.minisig
            ${{ runner.temp }}/governator-release-dist/*.hmac
