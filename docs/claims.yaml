  - id: sol4-s2-descendant-containment
    title: "A governed local launch wraps its process tree in a descendant-owning primitive (systemd transient scope on cgroup v2, then a directly-managed cgroup via CLONE_INTO_CGROUP, then unshare --user --pid --fork --mount-proc as a last resort); a DESCENDANTS_TERMINATED lifecycle stage freezes the cgroup, kills the whole owned tree, and waits for confirmed extinction (cgroup.procs empty) before final-state capture. A high-risk run refuses outright when no primitive is available rather than degrading to process-group-only kill. A detached setsid + double-fork + delayed-write child cannot survive the execution boundary"
