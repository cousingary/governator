  - id: layered-ask-policy
    title: "Four-way policy verdicts (ALLOW/DENY/ASK/FLAG) across org -> project doctrine -> job contract -> session/operator layers, with checkpointed ASK resolved via gov ask approve|deny (optionally as an expiring override) that resumes from checkpoint rather than restarting the agent"
    first_shipped_version: v1.4-session5
    # Sol redteam v3 S8 (P1.1, finding #8) replaced the claim-equals-consume
    # one-shot override with a real available->reserved->consumed|released|
    # expired lifecycle (ConsumePolicyOverride -> ConsumePolicyOverrideReservation
    # + new ReleasePolicyOverrideReservation), fixing the reproduced bug where
    # rule A's approval was burned even when rule B's still-pending ASK meant
    # no execution ever happened. That rename invalidates this claim's old
    # binary_build_evidence historical-symbol proof (commit
    # 9c25e43e56d02b0f1b679ccd99b66813648bdd91 predates the rename, so it can
    # never contain the new symbol names) — downgraded shipped -> tested
    # rather than left overclaiming. binary_build_evidence/acceptance_artifacts
    # below are kept as an accurate historical record of the v1.4.1 release,
    # not as current shipped-maturity proof; re-establish "shipped" against a
    # fresh binary_build_evidence.commit in a future release pass (S14/S15).
    #
    # 2026-07-13: raised tested -> ACCEPTED. A real acceptance pass against the
    # live claude-code CLI now exercises the post-rename lifecycle end to end
    # (evidence/acceptance-2026-07-13-attest-ask.json): the ASK gate quarantines
    # BEFORE any backend launch at zero cost, a bare `gov ask approve` unblocks
    # exactly one real run (APPROVED, merged, $0.084), and the NEXT run re-ASKs
    # on a fresh checkpoint at zero cost — proving the reserved->consumed
    # boundary S8 rebuilt. SHIPPED still requires identity-embedding binary
    # provenance from the canonical scripts/release.sh; that invocation was
    # denied by the permission layer in the session that produced this evidence,
    # and a plain `go build` (version=1.5.0-dev, source_commit=unknown) is not
    # acceptable provenance. Re-cut via scripts/release.sh and set
    # binary_build_evidence.commit to that build to close the last rung.
    claimed_maturity: accepted
    implementation:
      - file: internal/policy/verdict.go
        symbols: [Verdict, EvaluateLayers, ResolveOverrides, LayerResult]
      - file: internal/policy/decision.go
        symbols: [PolicyDecision]
      - file: internal/observability/policy_checkpoints.go
        symbols: [RecordPolicyCheckpoint, ResolvePolicyCheckpoint, RecordPolicyOverride, ActivePolicyOverrides, ConsumePolicyOverrideReservation, ReleasePolicyOverrideReservation]
    cli:
      command: "gov ask approve"
    tests:
      - file: internal/policy/verdict_test.go
        funcs:
          - TestEvaluateLayersOrgDenyIsFinalOverAnyLaterLayer
          - TestEvaluateLayersAskWithNoDenyStaysAsk
          - TestEvaluateLayersFlagNeverBlocks
          - TestResolveOverridesOnlyResolvesMatchingAskRuleID
          - TestResolveOverridesNeverResolvesDeny
      - file: internal/runtime/policy_gate_test.go
        funcs:
          - TestPolicyGateOrgAskQuarantinesBeforeLaunchAndRecordsCheckpoint
          - TestPolicyGateApprovedOverrideLetsSubsequentRunProceed
          - TestPolicyGateBareApproveUnblocksExactlyOnce
          - TestFallbackEligibleConsultsPolicyGateForUnusualInfraFailure
      - file: internal/runtime/sol3_ask_lifecycle_test.go
        funcs:
          - TestSol3OneShotApprovalSurvivesWhenAnotherRuleStillBlocks
    acceptance_artifacts:
      - path: evidence/acceptance-2026-07-13-attest-ask.json
        pointer: acceptance_evidence.3_ask_policy_lifecycle
    binary_build_evidence:
      evidence_file: evidence/release-v1.4.1.json
      commit: 9c25e43e56d02b0f1b679ccd99b66813648bdd91
      platform: linux_amd64

