        symbols: [fallbackEligible, recordFallbackAttempt, routingFallbackEnabled]
    cli:
      command: "gov run"
    tests:
      - file: internal/runtime/runtime_test.go
        funcs:
          - TestAgentAutoFallbackRetriesNextCandidateOnInfraPreMutation
          - TestAgentAutoFallbackBlockedWhenWorktreeChanged
