# Machine-verified documentation claims (v1.4 Session 6 / Sol Phase 11).
#
# Every entry here is re-derived from the repository by `gov claims verify`
# (internal/claims), not hand-asserted: `claimed_maturity` is the only field
# a human writes as an opinion, and CI fails the moment the computed maturity
# (implemented < tested < accepted < shipped, each requiring the one before
# it) falls short of what's claimed. See docs/claims.md for the schema and
# how to add an entry.
#
# "shipped" specifically means: the binary_build_evidence commit is an
# ancestor of HEAD, that commit is recorded in the named evidence file
# alongside a real binary hash, and every implementation symbol actually
# existed in the code at that historical commit — i.e. the evidence's
# rebuilt binary really contains this feature, not just the current worktree.
