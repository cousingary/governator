# Sol v7 mandatory final attack corpus (report §"Mandatory final attack
# corpus", 41 cases). This is the single source of truth the identity-based
# release gate (Session 7, HS4) consumes — it replaces the old count-based
# MIN_REDTEAM_TESTS/EXPECTED_REDTEAM_SKIPS gate, which validated skip *count*,
# not the exact identity/reason of each skip.
#
# Do not rename an entry's `name` without updating every file that reserves
# it (search the exact string across internal/redteam/ first) — the gate,
# claims verification, and release.sh all key off these exact strings, and a
# silent rename would look identical to "case removed, unrelated case added"
# to the drift check.
#
# Fields:
#   case        - the corpus case number (1-41), independent of the v6
#                 TestAttackN / TestV6CaseN series already in this package.
#   name        - the exact Go test function name in internal/redteam/.
#   session     - which plan session (agents/governator-sol-upgrade7-plan.md)
#                 owns fixing and proving this case.
#   required    - true: this case must PASS (never SKIP or be absent) before
#                 a real release ships. Every case in this corpus is
#                 required=true; nothing in this plan is optional forever —
#                 `conditional` (below) is the only sanctioned exception, and
#                 only when a session has verified the constraint for real.
#   conditional - true only when the case is genuinely inexpressible on some
#                 environments (e.g. no live systemd --user manager, no
#                 second uid, no kernel Landlock ABI support) *and* an
#                 allowed_skip predicate+reason has been recorded by the
#                 session that verified the constraint. False here means "no
#                 conditional skip is currently authorized" — do not flip
#                 this speculatively; only the session implementing the case
#                 may add a predicate once it has confirmed the constraint is
#                 real, not a shortcut.
#   allowed_skip
#     predicate  - a capability key the gate checks against the
#                  environment_capabilities recorded in test-summary.json
#                  (e.g. "has_systemd_user", "has_second_uid",
#                  "landlock_abi_supports_required_rights"). Absent/false
#                  capability + case skipped with a reason that matches
#                  `reason` below = allowed. Anything else = unexpected skip,
#                  which blocks the release.
#     reason     - the exact (or prefix-matched) t.Skip reason the gate
#                  expects. A skip with a *different* reason at the same
#                  case name is treated as unexpected — this is exactly the
#                  HS4 defect ("the wrong test skipping while the count stays
#                  the same passes the gate") this manifest exists to close.
#   status      - informational only, not consumed by the gate: whether the
#                 case has a real black-box fixture (`implemented`) or is
#                 still a named `t.Skip` placeholder reserved for its owning
#                 session (`not_yet_implemented`). A `not_yet_implemented`
#                 case is still `required: true` — the gate will (correctly)
#                 refuse to release while any required case is not passing,
#                 regardless of this field.
#   attestation_category
#               - the sole signed capability-host category that may satisfy a
#                 production skip for this case. An absent category means the
#                 test may not be waived by an attestation.
