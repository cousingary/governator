task: Apply the smallest contract schema fix needed for the validator tests.
job_id: governator-contract-fix
job_type: code_change
agent: claude-code
mode: surgeon
workspace:
  root: /absolute/path/to/governator
  worktree: auto
allowed:
  read: ["internal/contracts/**", "go.mod", "go.sum"]
  write: ["internal/contracts/schema.go"]
  execute: ["go test ./internal/contracts"]
forbidden:
  paths: ["agents/**", ".git/**"]
  commands: ["rm -rf", "git push"]
  behaviors: [refactor, reformat, scope_expansion]
budget: {max_minutes: 10, max_commands: 20, max_files_changed: 1, max_lines_changed: 200, max_new_files: 0, max_deleted: 0}
preflight:
  intended_writes: ["internal/contracts/schema.go"]
success:
  required_files: ["internal/contracts/schema.go"]
  validators: ["go test ./internal/contracts"]
output:
  style: terse
  max_final_words: 80
on_violation: quarantine
